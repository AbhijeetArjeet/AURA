<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="35%" stop-color="#0F1322" />
      <stop offset="70%" stop-color="#161536" />
      <stop offset="100%" stop-color="#090D18" />
    </linearGradient>

    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#FF2A55" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Fira Code', 'Segoe UI', monospace, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 1px;
    }
    .tagline {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      fill: #94A3B8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #FFFFFF;
    }
  </style>

  <!-- Base Card -->
  <rect width="1200" height="320" rx="24" fill="url(#bgGrad)" />

  <!-- Cyber Glow Outer Border -->
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="none" stroke="url(#cyberGlow)" stroke-width="2.5" opacity="0.85" />

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Glowing Accent Spheres -->
  <circle cx="150" cy="70" r="130" fill="#00E5FF" opacity="0.12" filter="url(#glow)" />
  <circle cx="1080" cy="180" r="160" fill="#7C3AED" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="300" r="100" fill="#FF2A55" opacity="0.10" filter="url(#glow)" />

  <!-- Terminal Style Status Header -->
  <g transform="translate(60, 45)">
    <circle cx="10" cy="10" r="6" fill="#FF5F56" />
    <circle cx="30" cy="10" r="6" fill="#FFBD2E" />
    <circle cx="50" cy="10" r="6" fill="#27C93F" />
    <text x="75" y="15" font-family="'Fira Code', monospace" font-size="13" font-weight="600" fill="#64748B">~/abhijeet-arjeet (main) ⚡ AI-ENGINE ACTIVE</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(60, 125)">
    <!-- Title -->
    <text x="0" y="0" class="title" filter="url(#dropShadow)">ABHIJEET ARJEET</text>

    <!-- Subtitle -->
    <text x="0" y="38" class="subtitle">⚡ AI-Augmented Software Engineer &amp; Systems Builder</text>

    <!-- Tagline -->
    <text x="0" y="70" class="tagline">Crafting high-performance on-device utilities, media pipelines, and scalable open-source architectures.</text>
  </g>

  <!-- Feature Pill Badges (Right-Aligned / Bottom) -->
  <g transform="translate(60, 245)">
    <!-- Badge 1: Android & Kotlin -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#1E293B" stroke="#3DDC84" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#3DDC84" />
      <text x="35" y="24" class="badge-text">Android &amp; Kotlin</text>
    </g>

    <!-- Badge 2: Python Desktop -->
    <g transform="translate(195, 0)">
      <rect width="180" height="38" rx="19" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#38BDF8" />
      <text x="35" y="24" class="badge-text">Python &amp; PyQt6</text>
    </g>

    <!-- Badge 3: TypeScript -->
    <g transform="translate(390, 0)">
      <rect width="180" height="38" rx="19" fill="#1E293B" stroke="#818CF8" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#818CF8" />
      <text x="35" y="24" class="badge-text">TypeScript / Web</text>
    </g>

    <!-- Badge 4: AI Workflow -->
    <g transform="translate(585, 0)">
      <rect width="210" height="38" rx="19" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#A855F7" />
      <text x="35" y="24" class="badge-text">🤖 AI-Augmented Workflow</text>
    </g>

    <!-- Badge 5: YPDlp Creator -->
    <g transform="translate(810, 0)">
      <rect width="170" height="38" rx="19" fill="#1E293B" stroke="#FF2A55" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#FF2A55" />
      <text x="35" y="24" class="badge-text">🎬 YPDlp Creator</text>
    </g>
  </g>

  <!-- Glowing Corner Accent -->
  <path d="M 1160 300 L 1185 300 A 15 15 0 0 0 1200 285 L 1200 260" fill="none" stroke="#00E5FF" stroke-width="3" />
  <path d="M 40 20 L 15 20 A 15 15 0 0 0 0 35 L 0 60" fill="none" stroke="#FF2A55" stroke-width="3" />
</svg>
